# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Digital Garden
  pageTitleSuffix: " | Dr. Benjamin Schmidt"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: benrlschmidt.de
  ignorePatterns:
    - private
    - templates
    - daily
    - attachments/private
    - assets
    - calendar
    - css
    - export
    - Excalidraw
    - track
    - work
    - Day Planners~dev
    - journal
    - home
    - org
    - neorg
    - soga
    - textgenerator
    - literature
    - steuer
    - _inbox
    - _moc
    - 202*.md
    - "*.pdf"
    - "*.docx"
    - "*.csv"
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Source Sans 3
      body: Source Sans 3
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#1e1e2e"
        lightgray: "#313244"
        gray: "#7f849c"
        darkgray: "#cdd6f4"
        dark: "#f5e0dc"
        secondary: "#fab387"
        tertiary: "#f9e2af"
        highlight: rgba(250, 179, 135, 0.12)
        textHighlight: rgba(249, 226, 175, 0.35)
      darkMode:
        light: "#1e1e2e"
        lightgray: "#313244"
        gray: "#7f849c"
        darkgray: "#cdd6f4"
        dark: "#f5e0dc"
        secondary: "#fab387"
        tertiary: "#f9e2af"
        highlight: rgba(250, 179, 135, 0.12)
        textHighlight: rgba(249, 226, 175, 0.35)
plugins:
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5

  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - filesystem
    order: 10

  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20

  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30

  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40

  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60

  - source: github:quartz-community/description
    enabled: true
    order: 70

  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: github:quartz-community/remove-draft
    enabled: true

  - source: github:quartz-community/alias-redirects
    enabled: true

  - source: github:quartz-community/unlisted-pages
    enabled: true
    order: 45

  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true

  - source: github:quartz-community/favicon
    enabled: true

  - source: github:quartz-community/cname
    enabled: true

  - source: github:quartz-community/og-image
    enabled: false

  - source: github:quartz-community/content-page
    enabled: true

  - source: github:quartz-community/folder-page
    enabled: true

  - source: github:quartz-community/tag-page
    enabled: true

  - source: github:quartz-community/breadcrumbs
    enabled: true
    options:
      rootName: Garden
    layout:
      position: beforeBody
      priority: 5

  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10

  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20

  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30

  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10

  - source: github:quartz-community/spacer
    enabled: true
    layout:
      position: left
      priority: 15
      display: mobile-only

  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar

  - source: github:quartz-community/explorer
    enabled: true
    options:
      folderClickBehavior: collapse
      folderDefaultState: open
    layout:
      position: left
      priority: 50

  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      title: Recent Notes
      limit: 4
      showTags: true
      linkToMore: false
    layout:
      position: left
      priority: 60

  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10

  - source: github:quartz-community/table-of-contents
    enabled: true
    layout:
      position: right
      priority: 20
      display: desktop-only

  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 30

  - source: ./plugins/garden-footer
    enabled: true
    options:
      links:
        Website: https://benrlschmidt.de
        GitHub: https://github.com/benatouba
        ORCID: https://orcid.org/0000-0002-9669-3360
        LinkedIn: https://www.linkedin.com/in/dr-benjamin-schmidt/

  - source: github:quartz-community/explicit-publish
    enabled: true

layout:
  groups:
    toolbar:
      priority: 20
      direction: row
      gap: 0.5rem
  byPageType:
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
